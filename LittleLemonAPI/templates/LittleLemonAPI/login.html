<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
<div style="max-width: 400px; margin: 50px auto; padding: 20px; background: #f9f9f9; border-radius: 8px;">
    <h2>Log In</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #495e57; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">Log In</button>
    </form>
</div>
</body>
</html>
