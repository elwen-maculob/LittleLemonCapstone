<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>
<div style="max-width: 400px; margin: 50px auto; padding: 20px; background: #f9f9f9; border-radius: 8px; font-family: sans-serif;">
    <h2>Create an Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #495e57; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Register</button>
    </form>
    <p style="margin-top: 15px;">Already have an account? <a href="{% url 'login' %}">Log in here</a>.</p>
</div>
</body>
</html>
